server {
    listen 80 default_server;
    listen 8080 default_server;
    server_name _;

    root /opt/metin2-web/site;
    index client.html;

    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js;
        application/wasm                      wasm;
        application/json                      json;
        application/manifest+json             webmanifest;
        application/octet-stream              bin data;
        text/plain                            txt;
        image/png                             png;
        image/webp                            webp;
        image/jpeg                            jpg jpeg;
        image/svg+xml                         svg;
        image/x-icon                          ico;
    }

    location = / {
        return 302 /client.html?deflang=pl;
    }

    location /corpus/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /corpus/manifest.bin {
        add_header Cache-Control "no-cache";
    }

    location = /client.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /mobile_overlay.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /rejestracja.html {
        add_header Cache-Control "no-cache";
    }

    location = /wojny.html {
        add_header Cache-Control "no-cache";
    }

    location = /replay_hud.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /api/guild-war-replay {
        proxy_pass http://127.0.0.1:11497;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/guild-wars {
        proxy_pass http://127.0.0.1:11497;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/register {
        proxy_pass http://127.0.0.1:11497/api/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /to/ {
        proxy_pass http://127.0.0.1:11496/to/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
