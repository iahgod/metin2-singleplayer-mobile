<script>
// Versão desta página. Se o navegador abrir uma cópia ANTIGA guardada no cache
// (acontecia: "às vezes volta uma atualização"), pergunta ao servidor qual é a
// versão atual e, se for outra, recarrega uma vez já com a nova.
var M2W_PAGE_VER = "2.0.132-pl221-br13";
(function () {
  try {
    if (sessionStorage.getItem("m2w.verReload") === M2W_PAGE_VER) return;
    if (typeof fetch !== "function") return;
    fetch(location.pathname + "?_vc=" + Date.now(), { cache: "no-store" }).then(function (r) {
      return r.ok ? r.text() : "";
    }).then(function (t) {
      var m = /M2W_PAGE_VER = "([^"]+)"/.exec(t || "");
      if (m && m[1] !== M2W_PAGE_VER) {
        sessionStorage.setItem("m2w.verReload", m[1]);
        var u = new URL(location.href);
        u.searchParams.set("_v", m[1]);
        location.replace(u.toString());
      }
    }).catch(function () { });
  } catch (e) { }
})();
</script>

if (MOBILE) document.body.className += " mobile";
var statusEl = document.getElementById("status");
var Module = {
  /// Engine files get `?v=<build time>`, so a new build is never served from cache.
  locateFile: function (p) { return p + "?v=2.0.132-pl221-br9"; },
  canvas: document.getElementById("canvas"),
  preRun: [
    /// Mobile: /mobile.flag in the VFS makes game.py drop shadows and thicken fog.
    function () { if (MOBILE) Module.FS_createDataFile('/', 'mobile.flag', '1', true, true); },
    /// PT-BR: baixa a traducao (site/i18n/pt/) para /m2w_pt/ antes do jogo iniciar;
    /// client.js (m2w.installPtBr) a instala quando o idioma escolhido for 'pt'.
    function () {
      if (typeof fetch !== "function" || !Module.addRunDependency) return;
      var files = ["locale_game.txt", "locale_interface.txt", "item_names.txt", "mob_names.txt", "playerbot_texts.txt"];
      try { Module.FS.mkdir("/m2w_pt"); } catch (e) { }
      Module.addRunDependency("m2w_ptbr");
      var pending = files.length;
      var done = function () { if (--pending === 0) Module.removeRunDependency("m2w_ptbr"); };
      files.forEach(function (f) {
        fetch("i18n/pt/" + f + "?v=2.0.132-pl221-br9", { cache: "no-cache" }).then(function (r) {
          return r.ok ? r.arrayBuffer() : null;
        }).then(function (buf) {
          if (buf && buf.byteLength) Module.FS.writeFile("/m2w_pt/" + f, new Uint8Array(buf));
        }).catch(function () { }).then(done);
      });
    }
  ],
  /// Engine start-up text in the middle of the screen; empty = hide it.
  setStatus: function (t) {
    if (!statusEl) return;
    // Mensagens padrão do Emscripten -> PT-BR
    t = String(t || "")
      .replace(/^Downloading data\.\.\./, "Baixando dados...")
      .replace(/^Downloading\.\.\./, "Baixando...")
      .replace(/^Preparing\.\.\./, "Preparando...")
      .replace(/^Running\.\.\./, "Iniciando...")
      .replace(/^All downloads complete\./, "Downloads concluídos.");

    if (!t) statusEl.className = "done";
  },
  /// Engine stdout to the browser console.
  print: function (t) { console.log(t); },
  /// Engine stderr to the browser console as errors.
  printErr: function (t) {

  },

  onAbort: function (what) {
    var e = document.getElementById("m2w_error");

  if (ev && ev.message && /RuntimeError|abort|unreachable/.test(ev.message)) Module.onAbort(ev.message);
